        const icon = btn.querySelector('.icon');
        if (icon) icon.innerHTML = iconHTML(SoundFX.enabled ? 'volume-on' : 'volume-off');
        btn.classList.toggle('toggle-off', !SoundFX.enabled);
    },

    toggleMoveHints() {
        this.showMoveHints = !this.showMoveHints;
        try { localStorage.setItem('xiangqi_move_hints', this.showMoveHints ? 'true' : 'false'); } catch (e) {}
        this.updateHintUI();
        this.refreshUI(); // vẽ/xoá ngay chấm gợi ý cho quân đang được chọn (nếu có)
    },

    updateHintUI() {
        const btn = document.getElementById('hint-toggle-btn');
        if (!btn) return;
        const icon = btn.querySelector('.icon');
        if (icon) icon.innerHTML = iconHTML(this.showMoveHints ? 'target' : 'target-off');
        btn.classList.toggle('toggle-off', !this.showMoveHints);
    },

    // Vẽ tia sáng nối từ (các) quân đang chiếu tới Tướng bị chiếu. Toạ độ pixel
    // dùng chung hệ quy chiếu với lưới bàn cờ (board-svg): ô (x,y) -> (24 + x*56, 24 + y*56).
    renderCheckBeam(inCheck) {
        const svg = document.getElementById('check-beam-layer');
        if (!svg) return;
        if (!inCheck) { svg.innerHTML = ''; return; }

        const gen = this.pieces.find(p => p.type === 'Tướng' && p.side === this.turn);
        const checkers = findCheckingPieces(this.turn, this.pieces);
        if (!gen || checkers.length === 0) { svg.innerHTML = ''; return; }

        const px = gx => 24 + gx * 56;
        const py = gy => 24 + gy * 56;
        const gx = px(gen.x), gy = py(gen.y);

        let defsInner = `<radialGradient id="beamImpact" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FFD9A0" stop-opacity="0.95"/>
            <stop offset="45%" stop-color="#FF6A45" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#FF6A45" stop-opacity="0"/>
        </radialGradient>`;

        let beams = '';
        checkers.forEach((c, idx) => {
            const cx = px(c.x), cy = py(c.y);
            const gradId = `beamGrad${idx}`;
            defsInner += `<linearGradient id="${gradId}" gradientUnits="userSpaceOnUse" x1="${cx}" y1="${cy}" x2="${gx}" y2="${gy}">
                <stop offset="0%" stop-color="#C9A15C" stop-opacity="0.12"/>
                <stop offset="60%" stop-color="#E8A85A" stop-opacity="0.78"/>
                <stop offset="100%" stop-color="#FF5A3C" stop-opacity="1"/>
            </linearGradient>`;
            beams += `<line x1="${cx}" y1="${cy}" x2="${gx}" y2="${gy}" class="check-beam-glow" stroke="url(#${gradId})" />
                <line x1="${cx}" y1="${cy}" x2="${gx}" y2="${gy}" class="check-beam-core" stroke="url(#${gradId})" />
                <circle cx="${cx}" cy="${cy}" r="6" class="check-beam-origin" />`;
        });

        svg.innerHTML = `<defs>${defsInner}</defs>${beams}<circle cx="${gx}" cy="${gy}" r="26" class="check-beam-impact" />`;
    },

    buildMatrixDOM() {
        const grid = document.getElementById('matrix-grid');
        grid.innerHTML = '';
        for (let y = 0; y < 10; y++) {
            for (let x = 0; x < 9; x++) {
                const cell = document.createElement('div');
                cell.className = 'intersection';
                cell.id = `coord-${x}-${y}`;
                cell.style.left = `${x * 56}px`;
                cell.style.top = `${y * 56}px`;
                cell.onclick = () => this.handleGridAction(x, y);
                grid.appendChild(cell);
            }
        }
    },

    reset() {
        this.interruptAI();
        this.pieces = JSON.parse(JSON.stringify(this.blueprint));
        this.turn = this.nextTurnFirst ? this.nextTurnFirst : 'red';
        this.selectedIdx = null;
        this.historyStack = [];
        this.positionCounts = {};
        this.lastMove = null;

        const nameBlack = document.getElementById('name-black');
        const avatarBlack = document.getElementById('avatar-black');
        const infoEl = document.getElementById('ai-search-info');
        if (infoEl) infoEl.innerText = '';

        if (this.isAIActive) {
            nameBlack.innerText = "Siêu Máy Skynet";
            avatarBlack.innerHTML = iconHTML('robot');
        } else {
            nameBlack.innerText = "Bạch Hổ Kỳ Vương";
            avatarBlack.innerHTML = 'X';
        }

        this.refreshUI();
        if (this.isAIActive && this.turn === 'black') {
            setTimeout(() => this.makeAIMove(), 400);
        }
    },

    refreshUI() {
        const cardRed = document.getElementById('player-red');
        const cardBlack = document.getElementById('player-black');
        if (this.turn === 'red') {
            cardRed.classList.add('active');
            cardBlack.classList.remove('active');
        } else {
            cardBlack.classList.add('active');
            cardRed.classList.remove('active');
        }

        // Chỉ báo đang bị chiếu — hiển thị đúng vì luật đã được xử lý chính xác
        const inCheck = isKingInCheck(this.turn, this.pieces);
        cardRed.classList.toggle('in-check', this.turn === 'red' && inCheck);
        cardBlack.classList.toggle('in-check', this.turn === 'black' && inCheck);
        this.renderCheckBeam(inCheck);

        document.getElementById('win-red').innerText = this.records.red.win;
        document.getElementById('lose-red').innerText = this.records.red.lose;
        document.getElementById('win-black').innerText = this.records.black.win;
        document.getElementById('lose-black').innerText = this.records.black.lose;

        const redBox = document.getElementById('captured-by-red');
        const blackBox = document.getElementById('captured-by-black');
        redBox.innerHTML = ''; blackBox.innerHTML = '';

        this.blueprint.forEach(original => {
            const isAlive = this.pieces.some(p => p.id === original.id);
            if (!isAlive) {
                const mini = document.createElement('div');
                mini.className = `mini-piece ${original.side}`;
                mini.innerText = original.name;
                if (original.side === 'black') redBox.appendChild(mini);
                else blackBox.appendChild(mini);
            }
        });

        document.querySelectorAll('.intersection').forEach(c => c.classList.remove('valid-target', 'last-move', 'last-move-from'));
        if (this.lastMove) {
            const fromEl = document.getElementById(`coord-${this.lastMove.fromX}-${this.lastMove.fromY}`);
            const toEl = document.getElementById(`coord-${this.lastMove.toX}-${this.lastMove.toY}`);
            if (fromEl) fromEl.classList.add('last-move', 'last-move-from');
            if (toEl) toEl.classList.add('last-move');
        }
        if (this.selectedIdx !== null && this.showMoveHints) {
            for (let y = 0; y < 10; y++) {
                for (let x = 0; x < 9; x++) {
                    if (isLegalMove(this.selectedIdx, x, y, this.pieces)) {
                        document.getElementById(`coord-${x}-${y}`).classList.add('valid-target');
                    }
                }
            }
        }

        this.renderPieces();
    },

    // Render quân cờ theo kiểu "tái sử dụng phần tử DOM" (diff theo piece.id) thay vì
    // xóa-và-tạo-lại-toàn-bộ mỗi lần refresh — vừa nhẹ hơn cho trình duyệt, vừa tránh mất
    // trạng thái onclick/class không cần thiết. Quân cờ chuyển vị trí tức thì, không hiệu ứng.
    renderPieces() {
        const box = document.getElementById('pieces-box');
        const existingEls = {};
        box.querySelectorAll('.chess-piece[data-id]').forEach(el => { existingEls[el.dataset.id] = el; });
        const aliveIds = new Set(this.pieces.map(p => String(p.id)));

        this.pieces.forEach((p, index) => {
            const idStr = String(p.id);
            let pEl = existingEls[idStr];

            if (!pEl) {
                pEl = document.createElement('div');
                pEl.dataset.id = idStr;
                pEl.innerHTML = `<span class="glyph">${p.name}</span>`;
                box.appendChild(pEl);
            }

            pEl.className = `chess-piece ${p.side}`;
            if (this.selectedIdx === index) pEl.classList.add('selected');
            if (this.selectedIdx !== null && this.showMoveHints && isLegalMove(this.selectedIdx, p.x, p.y, this.pieces)) {
                pEl.classList.add('valid-enemy-target');
            }
            pEl.onclick = (e) => { e.stopPropagation(); this.handlePieceAction(index); };

            pEl.style.setProperty('--tx', `${p.x * 56}px`);
            pEl.style.setProperty('--ty', `${p.y * 56}px`);
        });

        // Xóa ngay khỏi DOM các quân không còn trong this.pieces (đã bị ăn)
        Object.keys(existingEls).forEach(idStr => {
            if (!aliveIds.has(idStr)) existingEls[idStr].remove();
        });
    },

    showModal(options) {
        const overlay = document.getElementById('custom-modal');
        const win = overlay.querySelector('.modal-window');
        win.classList.remove('theme-gold', 'theme-red', 'theme-blue');
        win.classList.add(`theme-${options.theme || 'gold'}`);

        document.getElementById('modal-title-text').innerText = options.title || 'Thông Báo';
        document.getElementById('modal-body-text').innerHTML = options.message || '';
        document.getElementById('modal-icon-box').innerHTML = iconHTML(options.icon || 'info');

        const actionsBox = document.getElementById('modal-actions-box');
        actionsBox.innerHTML = '';

        if (options.type === 'confirm') {
            const btnCancel = document.createElement('button');
            btnCancel.className = 'modal-btn btn-cancel';
            btnCancel.innerText = options.cancelText || 'Hủy';
            btnCancel.onclick = () => { overlay.classList.remove('active'); };
            actionsBox.appendChild(btnCancel);
        }

        const btnConfirm = document.createElement('button');
        btnConfirm.className = `modal-btn ${options.theme === 'red' ? 'btn-confirm-red' : 'btn-confirm-gold'}`;
        btnConfirm.innerText = options.confirmText || 'Xác Nhận';
        btnConfirm.onclick = () => {
            overlay.classList.remove('active');
            if (typeof options.onConfirm === 'function') options.onConfirm();
        };
        actionsBox.appendChild(btnConfirm);
        overlay.classList.add('active');
    },

    confirmReset() {
        this.showModal({
            type: 'confirm', theme: 'gold', icon: 'rotate-right',
            title: 'Khởi Tạo Ván Mới', message: 'Bạn có chắc chắn muốn hủy ván cờ hiện tại để bắt đầu một trận đấu mới không?',
            confirmText: 'Đồng Ý', onConfirm: () => this.reset()
        });
    },

    confirmResetRecords() {
        this.showModal({
            type: 'confirm', theme: 'red', icon: 'trash',
            title: 'Xóa Sạch Điểm Số', message: 'Hành động này sẽ đưa tỷ số Thắng / Thua của cả 2 phe về 0.\nBạn có tiếp tục?',
            confirmText: 'Xóa Hết',
            onConfirm: () => {
                this.records = { red: { win: 0, lose: 0 }, black: { win: 0, lose: 0 } };
                this.nextTurnFirst = null;
                localStorage.setItem('xiangqi_records_v2', JSON.stringify(this.records));
                this.refreshUI();
            }
        });
    },

    handlePieceAction(index) {
        if (this.isAIActive && this.turn === 'black') return; // Chặn bấm khi máy đang tính
        const targetPiece = this.pieces[index];
        if (targetPiece.side === this.turn) {
            this.selectedIdx = (this.selectedIdx === index) ? null : index;
            this.refreshUI();
        } else if (this.selectedIdx !== null) {
            this.handleGridAction(targetPiece.x, targetPiece.y);
        }
    },

    handleGridAction(x, y) {
        if (this.selectedIdx === null) return;
        if (this.isAIActive && this.turn === 'black') return;

        if (isLegalMove(this.selectedIdx, x, y, this.pieces)) {
            this.historyStack.push(JSON.stringify({ pieces: this.pieces, turn: this.turn, lastMove: this.lastMove }));
            const activePiece = this.pieces[this.selectedIdx];
            const fromX = activePiece.x, fromY = activePiece.y;
            const enemyIdx = this.pieces.findIndex(p => p.x === x && p.y === y);
            let isGameOver = false;

            if (enemyIdx !== -1) {
                // Trường hợp dự phòng: về lý thuyết không nên xảy ra vì luật chiếu đã chặn từ trước
                if (this.pieces[enemyIdx].type === 'Tướng') isGameOver = true;
                this.pieces.splice(enemyIdx, 1);
            }

            activePiece.x = x; activePiece.y = y;
            this.lastMove = { fromX, fromY, toX: x, toY: y, pieceId: activePiece.id, wasCapture: enemyIdx !== -1 };

            if (isGameOver) {
                SoundFX.playCapture();
                this.executeGameOver(activePiece.side);
                return;
            }

            this.turn = (this.turn === 'red') ? 'black' : 'red';
            this.selectedIdx = null;
            this.refreshUI();

            if (isKingInCheck(this.turn, this.pieces)) SoundFX.playCheck();
            else if (enemyIdx !== -1) SoundFX.playCapture();

            // Kiểm tra hòa cờ do lặp lại thế cờ 3 lần
            if (this.checkRepetitionDraw()) return;

            // Kiểm tra chiếu bí / hết nước đi cho bên vừa được trao lượt
            if (!hasLegalMoves(this.turn, this.pieces)) {
                this.executeGameOver(activePiece.side);
                return;
            }

            if (this.isAIActive && this.turn === 'black') {
                setTimeout(() => this.makeAIMove(), 250);
            }
        }
    },

    // Trả về true nếu thế cờ hiện tại đã lặp lại đủ 3 lần -> xử lý hòa cờ
    checkRepetitionDraw() {
        const key = positionKey(this.pieces, this.turn);
        this.positionCounts[key] = (this.positionCounts[key] || 0) + 1;
        if (this.positionCounts[key] >= 3) {
            this.executeDraw();
            return true;
        }
        return false;
    },

    executeDraw() {
        this.nextTurnFirst = this.turn === 'red' ? 'black' : 'red';
        this.refreshUI();
        this.showModal({
            type: 'alert', theme: 'gold', icon: 'info',
            title: 'Hòa Cờ', message: 'Thế cờ đã lặp lại 3 lần liên tiếp — ván đấu kết thúc với kết quả hòa.',
            confirmText: 'Ván Mới', onConfirm: () => this.reset()
        });
    },

    executeGameOver(winner) {
        const loser = winner === 'red' ? 'black' : 'red';
        this.nextTurnFirst = loser;

        this.records[winner].win += 1;
        this.records[loser].lose += 1;
        localStorage.setItem('xiangqi_records_v2', JSON.stringify(this.records));
        this.refreshUI();

        let msg = `🏆 Phe <b style="color:${winner === 'red' ? '#ff3333' : '#00e6ff'}">${winner === 'red' ? 'ĐỎ' : 'XANH'}</b> thắng!`;
        if (this.isAIActive) {
            msg = winner === 'black'
                ? "🤖 Bạn đã thất bại trước **Siêu Máy Skynet**! Hãy thử lại ở ván sau để phục hận."
                : "🎉 Thật kinh ngạc! Bạn đã hạ gục siêu trí tuệ AI cao cấp thành công!";
        }

        this.showModal({
            type: 'alert', theme: winner === 'red' ? 'red' : 'blue', icon: 'trophy',
            title: 'Trận Đấu Kết Thúc', message: msg,
            confirmText: 'Trận Kế Tiếp', onConfirm: () => this.reset()
        });
    },

    undo() {
        if (this.historyStack.length === 0) {
            this.showModal({
                type: 'alert', theme: 'gold', icon: 'warning',
                title: 'Không Thể Đi Lại', message: 'Bàn cờ đang ở trạng thái khởi đầu, chưa ghi nhận nước đi nào!',
                confirmText: 'Đã Hiểu'
            });
            return;
        }
        this.interruptAI();
        this.positionCounts = {};
        if (this.isAIActive && this.historyStack.length >= 2) {
            this.historyStack.pop(); // Xóa nước của máy
            const previousState = JSON.parse(this.historyStack.pop()); // Lấy nước trước của người
            this.pieces = previousState.pieces; this.turn = previousState.turn;
            this.lastMove = previousState.lastMove || null;
        } else {
            const previousState = JSON.parse(this.historyStack.pop());
            this.pieces = previousState.pieces; this.turn = previousState.turn;
            this.lastMove = previousState.lastMove || null;
        }
        this.selectedIdx = null; this.refreshUI();
    },

    // ==========================================================
    // AI: ưu tiên giao việc cho Web Worker (không đơ UI); nếu môi trường
    // chặn Worker thì tự động tính ngay trên luồng chính (fallback).
    // ==========================================================
    makeAIMove() {
        document.getElementById('player-black').classList.add('thinking');
        this.searchId++;
        const myId = this.searchId;
        const diff = DIFFICULTY_PRESETS[this.difficulty] || DIFFICULTY_PRESETS.medium;
        const piecesSnapshot = JSON.parse(JSON.stringify(this.pieces));

        if (this.workerAvailable && this.aiWorker) {
            this.aiWorker.postMessage({
                type: 'think', searchId: myId, side: 'black',
                pieces: piecesSnapshot, maxDepth: diff.maxDepth, timeBudget: diff.timeBudget
            });
        } else {
            // Chế độ dự phòng: tính trực tiếp trên luồng chính, chia nhỏ theo
            // từng độ sâu (setTimeout) để không đơ hoàn toàn giao diện.
            setTimeout(() => {
                findBestMoveAsync('black', piecesSnapshot, diff.timeBudget, diff.maxDepth, (result) => {
                    this.handleSearchResult({
                        type: 'result', searchId: myId,
                        move: result.move, score: result.score, depth: result.depth, nodes: result.nodes,
                        book: result.book, bookLabel: result.bookLabel
                    });
                });
            }, 30);
        }
    },

    handleSearchResult(data) {
        if (data.searchId !== this.searchId) return; // Kết quả của lần tính toán đã bị hủy — bỏ qua
        document.getElementById('player-black').classList.remove('thinking');

        if (data.type === 'error') {
            console.error('Lỗi tìm kiếm AI:', data.message);
            this.executeGameOver('red');
            return;
        }

        const infoEl = document.getElementById('ai-search-info');
        const bestMove = data.move;

        if (!bestMove) {
            if (infoEl) infoEl.innerText = '';
            this.executeGameOver('red'); // Hết nước đi hợp lệ -> AI thua (chiếu bí)
            return;
        }

        if (infoEl) {
            infoEl.innerText = data.book ? `📖 Sách khai cuộc: ${data.bookLabel}` : '';
        }

        this.historyStack.push(JSON.stringify({ pieces: this.pieces, turn: this.turn, lastMove: this.lastMove }));

        const aiPiece = this.pieces[bestMove.pieceIndex];
        const fromX = aiPiece.x, fromY = aiPiece.y;
        const enemyIdx = this.pieces.findIndex(p => p.x === bestMove.targetX && p.y === bestMove.targetY);
        let isGameOver = false;

        if (enemyIdx !== -1) {
            if (this.pieces[enemyIdx].type === 'Tướng') isGameOver = true;
            this.pieces.splice(enemyIdx, 1);
        }

        aiPiece.x = bestMove.targetX;
        aiPiece.y = bestMove.targetY;
        this.lastMove = { fromX, fromY, toX: bestMove.targetX, toY: bestMove.targetY, pieceId: aiPiece.id, wasCapture: enemyIdx !== -1 };

        if (isGameOver) {
            SoundFX.playCapture();
            this.executeGameOver('black');
            return;
        }

        this.turn = 'red';
        this.refreshUI();

        if (isKingInCheck('red', this.pieces)) SoundFX.playCheck();
        else if (enemyIdx !== -1) SoundFX.playCapture();

        if (this.checkRepetitionDraw()) return;

        if (!hasLegalMoves('red', this.pieces)) {
            this.executeGameOver('black');
        }
    }
};

function adaptMobileBoard() {
    const wrapper = document.querySelector('.board-wrapper');
    const viewport = document.querySelector('.chess-viewport');
    if (!wrapper || !viewport) return;

    if (window.innerWidth <= 900) {
        const wrapperWidth = wrapper.clientWidth;
        const targetScale = (wrapperWidth - 2) / 505;
        const finalScale = Math.min(targetScale, 1);
        document.documentElement.style.setProperty('--board-scale', finalScale);
        wrapper.style.height = `${565 * finalScale}px`;
        viewport.style.left = `${(wrapperWidth - (505 * finalScale)) / 2}px`;
        viewport.style.top = '0px';
    } else {
        document.documentElement.style.setProperty('--board-scale', 1);
        wrapper.style.removeProperty('height');
        viewport.style.removeProperty('left'); viewport.style.removeProperty('top');
    }
}

window.addEventListener('resize', adaptMobileBoard);
window.addEventListener('DOMContentLoaded', adaptMobileBoard);
const originalInit = engine.init;
engine.init = function () { originalInit.apply(this, arguments); setTimeout(adaptMobileBoard, 60); };
window.onload = () => engine.init();

</script>
