    const dirs = [[0,1],[1,0],[1,1],[1,-1]];
    let totalO = 0, totalX = 0;
    const threatsO = [], threatsX = [];
    // Các mẫu "gãy" chỉ có ý nghĩa với len >= 4 (bàn 3x3 vốn đã được minimax đầy đủ xử lý riêng).
    const checkBroken = len >= 4;
    for(let idx=0; idx<b.length; idx++){
      const symbol = b[idx];
      if(!symbol) continue;
      const r0 = Math.floor(idx/size), c0 = idx % size;
      for(const [dr,dc] of dirs){
        const pr = r0-dr, pc = c0-dc;
        const prevSame = pr>=0 && pr<size && pc>=0 && pc<size && b[pr*size+pc]===symbol;
        if(prevSame) continue; // không phải điểm bắt đầu dãy theo hướng này -> bỏ qua để khỏi đếm trùng
        let count = 1;
        let r = r0+dr, c = c0+dc;
        while(r>=0 && r<size && c>=0 && c<size && b[r*size+c]===symbol){ count++; r+=dr; c+=dc; }
        const fwdEmpty = (r>=0 && r<size && c>=0 && c<size && !b[r*size+c]) ? r*size+c : null;
        const bwdEmpty = (pr>=0 && pr<size && pc>=0 && pc<size && !b[pr*size+pc]) ? pr*size+pc : null;
        const openEnds = (fwdEmpty!==null?1:0) + (bwdEmpty!==null?1:0);
        const s = lineScore(count, openEnds, len);
        if(symbol === 'O') totalO += s; else totalX += s;

        // Gom các mối đe doạ đáng kể (còn thiếu 1 hoặc 2 quân là đủ) kèm điểm chặn, để dò fork bên dưới
        const gap = len - count;
        const ends = [fwdEmpty, bwdEmpty].filter(e => e !== null);
        if(gap === 1 && ends.length){
          (symbol === 'O' ? threatsO : threatsX).push({ type: 'four', openEnds, ends });
        } else if(gap === 2 && openEnds === 2 && ends.length === 2){
          (symbol === 'O' ? threatsO : threatsX).push({ type: 'three', openEnds, ends });
        }

        if(checkBroken){
          // --- Tứ gãy: dãy chưa đạt "tứ" (count <= len-2) + có đầu hở -> kiểm tra thêm xem có phải
          // MỘT PHÍA của 1 tứ gãy hay không. Xét MỌI count từ 1 tới len-2 để bắt đủ mọi kiểu tách quân
          // quanh chỗ gãy (len=5: cả "3+1" OOO.O, "2+2" OO.OO, "1+3" O.OOO đều phải bắt được).
          if(count <= len-2){
            if(fwdEmpty !== null){
              // Cửa sổ tiến: bắt đầu ĐÚNG tại điểm đầu dãy, luôn đúng bất kể count.
              const cells = windowPatternCompletion(b, size, len, r0, c0, dr, dc, symbol, len-1, 1);
              if(cells){
                if(symbol === 'O') totalO += 600; else totalX += 600; // ngang giá trị 1 "tứ chặn 1 đầu" thường
                (symbol === 'O' ? threatsO : threatsX).push({ type: 'four', openEnds: 1, ends: cells });
              }
            }
            if(bwdEmpty !== null){
              // Cửa sổ lùi: cần đủ (len - count) ô tính lùi để cửa sổ dài đúng `len` và khớp cuối dãy hiện tại.
              const back = len - count;
              const cells = windowPatternCompletion(b, size, len, r0-dr*back, c0-dc*back, dr, dc, symbol, len-1, 1);
              if(cells){
                if(symbol === 'O') totalO += 600; else totalX += 600;
                (symbol === 'O' ? threatsO : threatsX).push({ type: 'four', openEnds: 1, ends: cells });
              }
            }
          }

          // --- Tam gãy: chỉ xét dãy CÒN NGẮN (count <= len-3) để tránh chồng lấn với vùng "tam liên
          // tục" đã được lineScore + nhánh gap===2 ở trên xử lý ổn rồi (count === len-2). Với len=5,
          // điều kiện này nghĩa là count 1 hoặc 2 — đúng những dãy ngắn mà cách quét cũ coi là "chưa
          // đáng kể" nhưng thực ra có thể đang là 1 phần của 1 tam gãy nguy hiểm (ví dụ O.OO, OO.O).
          //
          // Vì tam có TỚI 2 ô trống cần xác định (không như tứ chỉ có 1), vị trí cửa sổ không còn suy
          // ra DUY NHẤT từ count như tứ gãy nữa — nên phải thử mọi cửa sổ độ dài `len` có khả năng
          // "phủ" dãy hiện tại (không chỉ đúng 1 điểm neo). Số cửa sổ cần thử bị chặn trên bởi
          // (count + len - 1), với count nhỏ (≤ len-3) nên vẫn rẻ, không phụ thuộc kích thước bàn.
          if(count <= len-3 && ends.length){
            for(let s = -(len-1); s <= count-1; s++){
              const rs = r0 + dr*s, cs = c0 + dc*s;
              const cells = windowPatternCompletion(b, size, len, rs, cs, dr, dc, symbol, len-2, 2);
              if(cells){
                if(symbol === 'O') totalO += 380; else totalX += 380; // ngang giá trị 1 "tam" thường (400), hơi dè dặt hơn vì độ tin cậy thấp hơn tứ gãy
                (symbol === 'O' ? threatsO : threatsX).push({ type: 'three', openEnds: 2, ends: cells });
              }
            }
          }
        }
      }
    }
    const forkO = computeForkBonus(threatsO);
    const forkX = computeForkBonus(threatsX);
    return (totalO + forkO) - (totalX + forkX);
  }

  // ===== IncrementalEvaluator: bản THAY THẾ evaluateBoard cho riêng đường tìm kiếm alphaBeta =====
  // (đây chính là hướng "bitboard/duy trì tăng-dần" đã hứa, thay cho cách "tra bảng nhưng vẫn tính lại
  // từ đầu mỗi lần gọi" đã thử và bị loại vì đo ra CHẬM hơn — xem ghi chú ở evaluatePoint bên trên).
  //
  // Ý TƯỞNG: evaluateBoard quét TOÀN BỘ bàn cờ mỗi lần gọi — độ phức tạp tỉ lệ với KÍCH THƯỚC BÀN, dù
  // 1 nước đi trong lúc tìm kiếm chỉ làm đổi giá trị của 1 Ô DUY NHẤT. Đúng ra chỉ cần cập nhật lại phần
  // điểm số bị ảnh hưởng BỞI ô đó, không cần tính lại toàn bộ. Cụ thể: đặt/gỡ 1 quân tại idx0 chỉ có thể
  // làm thay đổi kết quả tính cho các cặp (idx2, hướng) mà idx0 nằm TRÊN đúng trục đó — và chỉ trong
  // phạm vi bán kính 2*len quanh idx0 (xa hơn thì hoặc không đọc tới, hoặc đã chắc chắn "đủ len liên
  // tiếp" từ trước nên không đổi kết luận nữa dù đếm được thêm bao nhiêu). Bán kính này đã được CHỨNG
  // MINH đủ an toàn bằng kiểm chứng ngẫu nhiên hơn 60.000 trường hợp (đặt/gỡ lồng nhau kiểu cây tìm
  // kiếm thật, thế cờ đông quân, chuỗi dài cố tình dò biên) trước khi đưa vào đây — xem lại nếu cần.
  //
  // computeCellDirContribution tái dùng NGUYÊN VĂN logic thân vòng lặp của evaluateBoard ở trên (tách
  // riêng ra để không phải chép tay 2 lần, tránh 2 bản logic lệch nhau theo thời gian).
  function computeCellDirContribution(b, size, len, idx, dr, dc, checkBroken){
    const symbol = b[idx];
    if(!symbol) return null;
    const r0 = Math.floor(idx/size), c0 = idx % size;
    const pr = r0-dr, pc = c0-dc;
    const prevSame = pr>=0 && pr<size && pc>=0 && pc<size && b[pr*size+pc]===symbol;
    if(prevSame) return null;

    let count = 1;
    let r = r0+dr, c = c0+dc;
    while(r>=0 && r<size && c>=0 && c<size && b[r*size+c]===symbol){ count++; r+=dr; c+=dc; }
    const fwdEmpty = (r>=0 && r<size && c>=0 && c<size && !b[r*size+c]) ? r*size+c : null;
    const bwdEmpty = (pr>=0 && pr<size && pc>=0 && pc<size && !b[pr*size+pc]) ? pr*size+pc : null;
    const openEnds = (fwdEmpty!==null?1:0) + (bwdEmpty!==null?1:0);

    let score = lineScore(count, openEnds, len);
    const threats = [];
    const gap = len - count;
    const ends = [fwdEmpty, bwdEmpty].filter(e => e !== null);
    if(gap === 1 && ends.length){
      threats.push({ type: 'four', openEnds, ends });
    } else if(gap === 2 && openEnds === 2 && ends.length === 2){
      threats.push({ type: 'three', openEnds, ends });
    }

    if(checkBroken){
      if(count <= len-2){
        if(fwdEmpty !== null){
          const cells = windowPatternCompletion(b, size, len, r0, c0, dr, dc, symbol, len-1, 1);
          if(cells){ score += 600; threats.push({ type:'four', openEnds:1, ends: cells }); }
        }
        if(bwdEmpty !== null){
          const back = len - count;
          const cells = windowPatternCompletion(b, size, len, r0-dr*back, c0-dc*back, dr, dc, symbol, len-1, 1);
          if(cells){ score += 600; threats.push({ type:'four', openEnds:1, ends: cells }); }
        }
      }
      if(count <= len-3 && ends.length){
        for(let s = -(len-1); s <= count-1; s++){
          const rs = r0+dr*s, cs = c0+dc*s;
          const cells = windowPatternCompletion(b, size, len, rs, cs, dr, dc, symbol, len-2, 2);
          if(cells){ score += 380; threats.push({ type:'three', openEnds:2, ends: cells }); }
        }
      }
    }
    return { symbol, score, threats };
  }

  const EVAL_DIRS = [[0,1],[1,0],[1,1],[1,-1]];

  class IncrementalEvaluator{
    constructor(size, len){
      this.size = size;
      this.len = len;
      this.checkBroken = len >= 4;
      this.totalO = 0;
      this.totalX = 0;
      this.cellDirMap = new Map(); // khoá idx*4+hướng -> { symbol, score, threats }
      this.RADIUS = 2 * len; // biên an toàn, xem giải thích ở trên
    }

    // Quét toàn bàn 1 LẦN DUY NHẤT (đầu mỗi lượt AI suy nghĩ) — kết quả tương đương evaluateBoard,
    // nhưng chỉ trả về gián tiếp qua score() để dùng lặp lại nhiều lần với chi phí O(1) sau đó.
    initFull(b){
      const { size, len, checkBroken } = this;
      this.totalO = 0; this.totalX = 0;
      this.cellDirMap.clear();
      for(let idx=0; idx<b.length; idx++){
        if(!b[idx]) continue;
        for(let dIdx=0; dIdx<4; dIdx++){
          const [dr,dc] = EVAL_DIRS[dIdx];
          const entry = computeCellDirContribution(b, size, len, idx, dr, dc, checkBroken);
          if(entry){
            const key = idx*4+dIdx;
            this.cellDirMap.set(key, entry);
            if(entry.symbol === 'O') this.totalO += entry.score; else this.totalX += entry.score;
          }
        }
      }
    }

    // Gọi NGAY SAU KHI b[moveIdx] vừa được đổi (đặt quân hoặc gỡ quân do quay lui trong alphaBeta) —
    // đối xứng hoàn toàn cho cả 2 chiều, không cần hàm "undo" riêng: cứ đổi bàn xong rồi gọi lại đúng
    // idx đó là tự cập nhật đúng theo trạng thái MỚI của bàn.
    applyMove(b, moveIdx){
      const { size, len, checkBroken, RADIUS } = this;
      const moveR = Math.floor(moveIdx/size), moveC = moveIdx % size;
      const seen = this._seen || (this._seen = new Set());
      seen.clear();
      for(let dIdx=0; dIdx<4; dIdx++){
        const [dr,dc] = EVAL_DIRS[dIdx];
        for(let k=-RADIUS; k<=RADIUS; k++){
          const r = moveR+dr*k, c = moveC+dc*k;
          if(r<0||r>=size||c<0||c>=size) continue;
          const idx2 = r*size+c;
          const key = idx2*4+dIdx;
          if(seen.has(key)) continue;
          seen.add(key);
          const old = this.cellDirMap.get(key);
          if(old){
            if(old.symbol === 'O') this.totalO -= old.score; else this.totalX -= old.score;
            this.cellDirMap.delete(key);
          }
          const fresh = computeCellDirContribution(b, size, len, idx2, dr, dc, checkBroken);
          if(fresh){
            this.cellDirMap.set(key, fresh);
            if(fresh.symbol === 'O') this.totalO += fresh.score; else this.totalX += fresh.score;
          }
        }
      }
    }

    // Tương đương evaluateBoard(b,size,len) tại đúng trạng thái bàn hiện tại, nhưng O(1) thay vì
    // O(kích thước bàn) — miễn là applyMove đã được gọi đúng cho MỌI thay đổi kể từ initFull().
    score(){
      // QUAN TRỌNG: computeForkBonus dừng ở cặp threat không-chung-điểm-chặn ĐẦU TIÊN tìm thấy nên phụ
      // thuộc THỨ TỰ duyệt — phải duyệt theo đúng thứ tự idx tăng dần rồi hướng, giống hệt evaluateBoard
      // gốc, chứ không theo thứ tự chèn của Map (đã bắt lỗi này bằng kiểm chứng ngẫu nhiên trước khi
      // đưa vào đây: cùng 1 tập threats nhưng khác thứ tự duyệt có thể ra fork bonus khác nhau).
      const sortedKeys = [...this.cellDirMap.keys()].sort((a,b)=>a-b);
      const threatsO = [], threatsX = [];
      for(const key of sortedKeys){
        const entry = this.cellDirMap.get(key);
        if(!entry.threats.length) continue;
        (entry.symbol === 'O' ? threatsO : threatsX).push(...entry.threats);
      }
      const forkO = computeForkBonus(threatsO);
      const forkX = computeForkBonus(threatsX);
      return (this.totalO + forkO) - (this.totalX + forkX);
    }
  }

  // Chỉ xét các ô trống nằm gần quân cờ đã đánh (bán kính 2) để tìm kiếm khả thi trên bàn lớn
  function getCandidates(b, size, radius){
    const set = new Set();
    let hasStone = false;
    for(let i=0;i<b.length;i++){
      if(!b[i]) continue;
      hasStone = true;
      const r0 = Math.floor(i/size), c0 = i % size;
      for(let dr=-radius; dr<=radius; dr++){
        for(let dc=-radius; dc<=radius; dc++){
          const r = r0+dr, c = c0+dc;
          if(r>=0 && r<size && c>=0 && c<size){
            const ni = r*size+c;
            if(!b[ni]) set.add(ni);
          }
        }
      }
    }
    if(!hasStone){
      const mid = Math.floor(size/2);
      set.add(mid*size + mid);
    }
    return [...set];
  }

  // Điểm của một ô trống nếu `mover` đánh vào đó: vừa tính tấn công cho mover, vừa tính chặn đối thủ
  function moveScore(b, size, len, idx, mover){
    const opp = mover === 'O' ? 'X' : 'O';
    return evaluatePoint(b, size, idx, mover, len) + evaluatePoint(b, size, idx, opp, len) * 0.85;
  }

  function topCandidates(b, size, len, candidates, topN, mover){
    return candidates
      .map(idx => ({ idx, score: moveScore(b, size, len, idx, mover) }))
      .sort((a, c) => c.score - a.score)
      .slice(0, topN)
      .map(s => s.idx);
  }

  // ===== #4: Move ordering nâng cao — killer-move heuristic + history heuristic =====
  // topCandidates ở trên chỉ sắp xếp TĨNH theo moveScore, tính lại y hệt mỗi lần gặp node mới, không
  // học được gì từ chính quá trình tìm kiếm. Hai kỹ thuật kinh điển bên dưới giúp alpha-beta cắt tỉa
  // hiệu quả hơn nhiều mà chi phí cài đặt thấp, vì chúng tận dụng lại thông tin đã "học" được khi duyệt
  // các nhánh anh em (sibling) hoặc ở độ sâu tương tự trước đó trong CÙNG một lần tìm kiếm:
  //  - Killer move: mỗi khi 1 nước gây cắt tỉa beta (fail-high) ở độ sâu X, nước đó thường cũng tốt ở
  //    các nhánh anh em cùng độ sâu X (dù bàn cờ khác đôi chút) — ưu tiên thử lại nó đầu tiên.
  //  - History heuristic: cộng dồn "điểm uy tín" cho mỗi (quân, ô) mỗi lần nó gây cắt tỉa, trọng số theo
  //    độ sâu² (cắt tỉa ở độ sâu càng lớn càng đáng tin) — dùng làm điểm cộng thêm vào moveScore tĩnh.
  // Cả 2 bảng được tạo mới và dùng chung cho toàn bộ 1 lần tính nước đi (reset mỗi khi đến lượt máy),
  // không tồn tại xuyên suốt nhiều nước đi vì bàn cờ đổi khác thì các nước "tốt" cũng đổi theo.
  const KILLER_SLOTS = 2;        // số nước "sát thủ" lưu lại cho mỗi độ sâu
  const HISTORY_WEIGHT = 0.5;    // trọng số quy đổi điểm history sang cùng thang với moveScore

  function makeSearchHeuristics(){
    return {
      killers: [],                                     // killers[depth] = [idx, idx] (tối đa KILLER_SLOTS)
      history: { O: new Float64Array(ZOBRIST_MAX_CELLS), X: new Float64Array(ZOBRIST_MAX_CELLS) }
    };
  }

  // Sắp xếp ứng viên cho 1 node cụ thể: killer move của đúng độ sâu này được đưa lên đầu (nếu vẫn còn
  // hợp lệ ở thế cờ hiện tại), phần còn lại xếp theo moveScore + phần thưởng history, rồi cắt còn branchWidth.
  function orderCandidatesForSearch(b, size, len, candidates, branchWidth, mover, depth, heur){
    const candidateSet = new Set(candidates);
    const killerList = (heur.killers[depth] || []).filter(idx => candidateSet.has(idx));
    const histTable = heur.history[mover];
    const rest = candidates.filter(idx => !killerList.includes(idx));
    const scored = rest.map(idx => ({
      idx,
      score: moveScore(b, size, len, idx, mover) + histTable[idx] * HISTORY_WEIGHT
    }));
    scored.sort((a, c) => c.score - a.score);
    const restOrdered = scored.slice(0, Math.max(0, branchWidth - killerList.length)).map(s => s.idx);
    return [...killerList, ...restOrdered];
  }

  // Ghi nhận 1 nước vừa gây cắt tỉa beta tại `depth`: cập nhật cả killer-move slot lẫn history table,
  // để các nhánh anh em (cùng cha) hoặc các lần gặp lại độ sâu này sau đó ưu tiên thử nước này trước.
  function recordCutoff(heur, depth, idx, mover){
    if(!heur.killers[depth]) heur.killers[depth] = [];
    const slots = heur.killers[depth];
    if(slots[0] !== idx){
      slots[1] = slots[0];
      slots[0] = idx;
      if(slots.length > KILLER_SLOTS) slots.length = KILLER_SLOTS;
    }
    heur.history[mover][idx] += depth * depth;
  }

  // Minimax + alpha-beta trên tập ứng viên gần quân cờ, dừng sớm nếu hết ngân sách thời gian.
  // h1/h2: hash Zobrist tăng dần của thế cờ hiện tại; tt: bảng transposition dùng chung cho cả
  // vòng đào sâu dần (iterative deepening) ở bestMoveSmart, để tái sử dụng kết quả đã tính.
  // heur: bảng killer-move + history dùng chung cho cả lần tìm kiếm, để cải thiện thứ tự duyệt nước đi.
  function alphaBeta(b, size, len, depth, alpha, beta, maximizing, lastIdx, lastSymbol, deadline, h1, h2, tt, heur, incEval, bb){
    if(Date.now() > deadline) throw 'AI_TIMEOUT';

    const win = checkWinBB(bb, Math.floor(lastIdx/size), lastIdx%size, lastSymbol, len);
    if(win){
      const sign = lastSymbol === 'O' ? 1 : -1;
      return sign * (WIN_SCORE + depth); // thắng càng nhanh điểm càng cao, thua càng chậm càng đỡ tệ
    }
    if(depth === 0) return incEval.score();

    // Tra bảng transposition: nếu thế cờ này đã từng được tính ở độ sâu >= độ sâu cần hiện tại,
    // dùng lại kết quả (hoặc thu hẹp cửa sổ alpha-beta nếu chỉ là chặn trên/dưới) thay vì tính lại.
    const key = h1 + '_' + h2;
    const cached = tt.get(key);
    const alphaOrig = alpha;
    if(cached && cached.depth >= depth){
      if(cached.flag === TT_EXACT) return cached.value;
      if(cached.flag === TT_LOWER && cached.value > alpha) alpha = cached.value;
      else if(cached.flag === TT_UPPER && cached.value < beta) beta = cached.value;
      if(alpha >= beta) return cached.value;
    }

    const candidates = getCandidatesBB(bb, size, 2);
    if(candidates.length === 0) return incEval.score();

    const mover = maximizing ? 'O' : 'X';
    const branchWidth = depth >= 5 ? 6 : 8;
    const ordered = orderCandidatesForSearch(b, size, len, candidates, branchWidth, mover, depth, heur);
    const Z = mover === 'O' ? ZOBRIST_O : ZOBRIST_X;

    let value;
    if(maximizing){
      value = -Infinity;
      for(const idx of ordered){
        const ir = Math.floor(idx/size), ic = idx%size;
        b[idx] = 'O';
        bb.set(ir, ic, 'O');
        incEval.applyMove(b, idx);
        const nh1 = h1 ^ Z[idx][0], nh2 = h2 ^ Z[idx][1];
        let score;
        try {
          score = alphaBeta(b, size, len, depth-1, alpha, beta, false, idx, 'O', deadline, nh1, nh2, tt, heur, incEval, bb);
        } finally {
          b[idx] = null; // luôn dọn lại, kể cả khi bị huỷ giữa chừng do hết giờ (ném lỗi AI_TIMEOUT)
          bb.clear(ir, ic, 'O');
          incEval.applyMove(b, idx); // đối xứng: gỡ quân xong gọi lại đúng idx là tự đồng bộ lại điểm số
        }
        if(score > value) value = score;
        if(value > alpha) alpha = value;
        if(alpha >= beta){ recordCutoff(heur, depth, idx, 'O'); break; }
      }
    } else {
      value = Infinity;
      for(const idx of ordered){
        const ir = Math.floor(idx/size), ic = idx%size;
        b[idx] = 'X';
        bb.set(ir, ic, 'X');
        incEval.applyMove(b, idx);
        const nh1 = h1 ^ Z[idx][0], nh2 = h2 ^ Z[idx][1];
        let score;
        try {
          score = alphaBeta(b, size, len, depth-1, alpha, beta, true, idx, 'X', deadline, nh1, nh2, tt, heur, incEval, bb);
        } finally {
          b[idx] = null; // luôn dọn lại, kể cả khi bị huỷ giữa chừng do hết giờ (ném lỗi AI_TIMEOUT)
          bb.clear(ir, ic, 'X');
          incEval.applyMove(b, idx);
        }
        if(score < value) value = score;
        if(value < beta) beta = value;
        if(alpha >= beta){ recordCutoff(heur, depth, idx, 'X'); break; }
      }
    }

    // Lưu lại kết quả vào TT kèm cờ EXACT/LOWER/UPPER tuỳ việc có bị cắt tỉa hay không,
    // để lần gặp lại thế cờ này (qua thứ tự nước đi khác) có thể tái sử dụng ngay.
    let flag = TT_EXACT;
    if(value <= alphaOrig) flag = TT_UPPER;
    else if(value >= beta) flag = TT_LOWER;
    tt.set(key, { depth, value, flag });

    return value;
  }

  // Thắng/chặn ngay được xử lý trước; sau đó tới TSS (Threat Space Search) hợp nhất bên dưới;
  // cuối cùng mới đào sâu dần (2, 4, 6... nước) bằng minimax trong ngân sách thời gian còn lại.
  //
  // Phân tích 1 nước đi ứng viên của `player` tại ô trống `idx`: nước này có phải là 1 nước ÉP BUỘC không
  // (đối thủ bắt buộc phải đáp trả, nếu không sẽ thua), và nếu có thì đối thủ có những lựa chọn đáp trả nào.
  // Trả về:
  //   { idx, winning: true }                                        — thắng ngay không thể đỡ (song tứ/song ba/tứ+ba không giao nhau)
  //   { idx, winning:false, forcing:true, defenderCandidates, threatCount } — nước ép buộc, đối thủ PHẢI đáp trả
  //                                                                    bằng 1 trong các ô trong defenderCandidates
  //   { idx, winning:false, forcing:false }                         — nước bình thường, không ép buộc gì
  //
  // LƯU Ý VỀ TÍNH ĐÚNG ĐẮN: defenderCandidates ở đây LUÔN được liệt kê ĐẦY ĐỦ (không cắt bớt) cho từng loại
  // đe doạ — vì đây là phía "phải đúng với MỌI lựa chọn của đối thủ" trong tìm kiếm AND-OR, cắt bớt ở đây
  // sẽ khiến kết luận "thắng chắc" bị SAI (bỏ sót đường thoát thật của đối thủ). Chỉ số lượng NƯỚC TẤN CÔNG
  // được thử (TSS_BRANCH_NARROW/TSS_BRANCH_WIDE ở tssSearch) mới được phép cắt bớt, vì đó chỉ ảnh hưởng
  // tới việc có tìm thấy hay không, không ảnh hưởng tính đúng đắn.
  function analyzeForcingMove(b, size, len, idx, player){
    b[idx] = player;
    const r0 = Math.floor(idx / size), c0 = idx % size;
    const dirs = [[0,1],[1,0],[1,1],[1,-1]];
    const threatSets = [];
    let winning = false;

    for(const [dr,dc] of dirs){
      let count = 1;
      let fr = r0+dr, fc = c0+dc;
      while(fr>=0 && fr<size && fc>=0 && fc<size && b[fr*size+fc]===player){ count++; fr+=dr; fc+=dc; }
      let br = r0-dr, bc = c0-dc;
      while(br>=0 && br<size && bc>=0 && bc<size && b[br*size+bc]===player){ count++; br-=dr; bc-=dc; }
      if(count >= len){ winning = true; continue; } // phòng hờ (thường đã bị chặn ở bước thắng-ngay phía trên)

      const e2InBounds = fr>=0 && fr<size && fc>=0 && fc<size;
      const e2Idx = e2InBounds ? fr*size+fc : -1;
      const e2Empty = e2InBounds && !b[e2Idx];
      const e1InBounds = br>=0 && br<size && bc>=0 && bc<size;
      const e1Idx = e1InBounds ? br*size+bc : -1;
      const e1Empty = e1InBounds && !b[e1Idx];

      if(count === len - 1){
        // "Bốn": mỗi đầu trống là 1 điểm đối thủ buộc phải chặn ngay, không thì thua ở nước sau
        const completions = [];
        if(e1Empty) completions.push(e1Idx);
        if(e2Empty) completions.push(e2Idx);
        if(completions.length >= 2) winning = true;
        else if(completions.length === 1) threatSets.push(completions);
      } else if(count === len - 2 && e1Empty && e2Empty){
        // "Ba": chỉ tính là ba sống thật (đe doạ ép buộc) nếu ít nhất 1 hướng mở rộng có thể tạo TỨ MỞ
        // (nghĩa là đầu xa hơn của dãy 4 tương lai cũng phải trống — nếu không, mở rộng ra cũng chỉ thành
        // tứ đơn, chặn bình thường sau này được, chưa cần coi là đe doạ ngay bây giờ).
        const f1r = br-dr, f1c = bc-dc;
        const f1InBounds = f1r>=0 && f1r<size && f1c>=0 && f1c<size;
        const f1Idx = f1InBounds ? f1r*size+f1c : -1;
        const f1Empty = f1InBounds && !b[f1Idx];

        const f2r = fr+dr, f2c = fc+dc;
        const f2InBounds = f2r>=0 && f2r<size && f2c>=0 && f2c<size;
        const f2Idx = f2InBounds ? f2r*size+f2c : -1;
        const f2Empty = f2InBounds && !b[f2Idx];

        if(f1Empty && f2Empty){
          // Ba sống 2 đầu: chặn 1 trong 2 ô sát cạnh (e1 hoặc e2) là đủ vô hiệu hoá cả 2 hướng cùng lúc
          // (chặn e1 khiến hướng e2 cũng hết mở vì thiếu quân chặn ở đầu bên kia, và ngược lại)
          threatSets.push([e1Idx, e2Idx]);
        } else if(f1Empty){
          // Chỉ hướng trái (qua e1) có thể mở thành tứ mở — tứ đó sẽ có 2 đầu là f1 và e2, nên CẢ BA cách
          // sau đều chặn được: chặn thẳng e1 (không cho đánh), chặn f1, hoặc chặn e2 (đều làm tứ đó hết mở)
          threatSets.push([e1Idx, f1Idx, e2Idx]);
        } else if(f2Empty){
          // Đối xứng: hướng phải (qua e2) mở thành tứ mở với 2 đầu là e1 và f2
          threatSets.push([e2Idx, f2Idx, e1Idx]);
        }
        // Cả f1 và f2 đều đã bị chặn sẵn -> chỉ là "ba chết", không coi là đe doạ VCT
      }
    }

    b[idx] = null;

    if(winning) return { idx, winning: true };
    if(threatSets.length === 0) return { idx, winning: false, forcing: false };

    // Giao của mọi threatSets: nếu rỗng, không có ô nào đỡ được hết mọi đe doạ cùng lúc -> thắng chắc (đòn kép)
    let intersection = threatSets[0];
    for(let i=1;i<threatSets.length;i++) intersection = intersection.filter(x => threatSets[i].includes(x));
    if(intersection.length === 0) return { idx, winning: true };

    return { idx, winning: false, forcing: true, defenderCandidates: [...new Set(threatSets.flat())], threatCount: threatSets.length };
  }

  // Liệt kê mọi nước ép buộc (bốn HOẶC ba sống) khả dĩ của `player` trong CÙNG một danh sách,
  // ưu tiên nước thắng ngay trước, rồi tới nước gây nhiều đe doạ cùng lúc, rồi tới nước có ít lựa
  // chọn đáp trả hơn (ép chặt hơn — nước "bốn" luôn có <=1 lựa chọn đáp trả nên tự nhiên xếp lên đầu).
  function findForcingMoves(b, size, len, player, bb){
    const candidates = getCandidatesBB(bb, size, 2);
    const results = [];
    for(const idx of candidates){
      const r = analyzeForcingMove(b, size, len, idx, player);
      if(r.winning || r.forcing) results.push(r);
    }
    results.sort((a, c) => {
      if(a.winning !== c.winning) return a.winning ? -1 : 1;
      const at = a.threatCount || 0, ct = c.threatCount || 0;
      if(at !== ct) return ct - at;
      const ad = a.defenderCandidates ? a.defenderCandidates.length : 0;
      const cd = c.defenderCandidates ? c.defenderCandidates.length : 0;
      return ad - cd;
    });
    return results;
  }

  // ===== TSS (Threat Space Search) hợp nhất: tìm kiếm đệ quy AND-OR duy nhất cho CẢ bốn lẫn ba sống =====
  // player liên tục tạo nước ép buộc (bốn HOẶC ba sống, xen kẽ tự do theo bất kỳ thứ tự nào tìm kiếm chọn ra);
  // với nước tạo "ba sống" (có thể có 2-3 cách chặn), phải thắng được ở TẤT CẢ các cách chặn của opponent
  // thì mới coi là chắc thắng — còn nước "bốn" thường chỉ có đúng 1 cách chặn nên gần như không tốn nhánh.
  // Nhờ xét chung 1 danh sách nên 1 chuỗi có thể bắt đầu bằng "ba", tiếp bằng "bốn", rồi lại "ba" — thay vì
  // bị ép phải toàn "bốn" (VCF cũ) hoặc phải chạy lại từ đầu ở 1 pha VCT tách biệt khi VCF thất bại.
  // Trả về mảng nước đi (bắt đầu từ nước hiện tại) dẫn tới thắng chắc chắn, hoặc null nếu không tìm được.
  function tssSearch(b, size, len, player, opponent, movesLeft, deadline, bb){
    if(Date.now() > deadline) throw 'VCF_TIMEOUT';
    if(movesLeft <= 0) return null;

    const moves = findForcingMoves(b, size, len, player, bb);
    if(moves.length === 0) return null;

    // Nước "bốn" (<=1 cách chặn) rất rẻ để thử vì hầu như không có nhánh AND bên dưới -> thử gần hết.
    // Nước "ba sống" (>=2 cách chặn) tốn hơn nhiều vì phải chứng minh thắng ở MỌI cách chặn -> chỉ thử
    // vài nước tốt nhất mỗi tầng. Cả hai loại được xét CÙNG một tầng đệ quy, không tách pha.
    const narrow = moves.filter(m => m.winning || !m.defenderCandidates || m.defenderCandidates.length <= 1);
    const wideSet = new Set(narrow);
    const wide = moves.filter(m => !wideSet.has(m));
    const tryMoves = [...narrow.slice(0, TSS_BRANCH_NARROW), ...wide.slice(0, TSS_BRANCH_WIDE)];

    for(const mv of tryMoves){
      if(mv.winning) return [mv.idx];

      const mvR = Math.floor(mv.idx/size), mvC = mv.idx%size;
      b[mv.idx] = player;
      bb.set(mvR, mvC, player);
      let provenForAll = true;
      let chosen = null;
      for(const d of mv.defenderCandidates){
        const dR = Math.floor(d/size), dC = d%size;
        b[d] = opponent;
        bb.set(dR, dC, opponent);
        let subPath = null;
        try {
          // Nước chặn bắt buộc đó lỡ khiến đối thủ tự thắng luôn thì bỏ nhánh này (an toàn tuyệt đối)
          if(!checkWinBB(bb, dR, dC, opponent, len)){
            subPath = tssSearch(b, size, len, player, opponent, movesLeft - 1, deadline, bb);
          }
        } catch(e){
          b[d] = null; bb.clear(dR, dC, opponent);
          b[mv.idx] = null; bb.clear(mvR, mvC, player);
          throw e;
        }
        b[d] = null;
        bb.clear(dR, dC, opponent);
        if(!subPath){ provenForAll = false; break; } // có 1 cách chặn mà player KHÔNG thắng tiếp được -> nước này thất bại
        if(!chosen) chosen = { d, subPath };
      }
      b[mv.idx] = null;
      bb.clear(mvR, mvC, player);
      if(provenForAll && chosen) return [mv.idx, chosen.d, ...chosen.subPath];
    }
    return null;
  }

  // Chủ động dò xem đối thủ có đang xây chuỗi thắng ép buộc nào hay không (bốn và/hoặc ba sống, cùng lúc
  // qua tssSearch), và nếu có, tìm nước phá. Trước đây có 2 lớp (VCF rồi mới VCT) gọi tuần tự; nay chỉ
  // 1 lớp duy nhất, vừa đơn giản hơn vừa không bỏ sót các chuỗi xen kẽ bốn/ba mà VCF thuần không thấy được.
  function findForcingDefense(b, size, len, mover, opponent, deadline, mult, bb){
    mult = mult || 1;
    // 1) PHÁT HIỆN: đối thủ có đang có sẵn 1 chuỗi ép buộc thắng hay không?
    const detectDeadline = Math.min(deadline, Date.now() + TSS_DEFENSE_DETECT_BUDGET_MS * mult);
    let opponentPath;
    try {
      opponentPath = tssSearch(b, size, len, opponent, mover, TSS_MAX_FORCING_MOVES, detectDeadline, bb);
    } catch(e){
      if(e === 'VCF_TIMEOUT') return null; // không kịp xác định trong ngân sách -> bỏ qua, để bước tìm kiếm tổng quát lo
      throw e;
    }
    if(!opponentPath) return null; // đối thủ không có mối đe doạ nào, không cần phòng thủ đặc biệt

    // 2) CÓ mối đe doạ THẬT (không còn là nghi ngờ) -> đây là tình huống sinh tử, đáng chi thêm thời gian
    // để tìm bằng được nước phá, dùng ngân sách "mở rộng" thay vì ngân sách mặc định dùng khi chỉ mới nghi ngờ.
    const searchDeadline = Math.min(deadline, Date.now() + TSS_DEFENSE_SEARCH_BUDGET_ESCALATED_MS * mult);

    // ===== NÂNG CẤP VCT — ĐÃ THỬ "LUÔN DÙNG ĐỘ SÂU TỐI ĐA" RỒI HOÀN LẠI =====
    // Lúc đầu tôi đổi dòng dưới thành "luôn dùng TSS_MAX_FORCING_MOVES" để lý luận "đối xứng tuyệt đối".
    // Về lý thuyết (thời gian vô hạn) điều đó đúng. NHƯNG trong thực tế mỗi ứng viên phòng thủ chỉ có một
    // ngân sách thời gian CỐ ĐỊNH (xem perCandidateBudget bên dưới) — ép xác minh luôn tìm sâu tối đa khiến
    // nhiều lượt xác minh KHÔNG kịp hoàn thành trong ngân sách đó, và mỗi lần không kịp, code phải coi đó là
    // "chưa chắc an toàn" (xem nhánh catch VCF_TIMEOUT ngay dưới) — tức càng "nghiêm ngặt" bao nhiêu, nó lại
    // càng dễ bỏ qua NHỮNG nước chặn đúng mà một lượt xác minh NÔNG HƠN nhưng HOÀN THÀNH được vẫn thấy rõ.
    // Nói cách khác: xác minh nông nhưng XONG > xác minh sâu nhưng THƯỜNG BỊ CẮT NGANG. Vì vậy quay lại đúng
    // công thức thích ứng gốc: độ sâu xác minh bám theo độ dài chuỗi đe doạ THẬT vừa tìm thấy (không nông hơn
    // TSS_DEFENSE_SUBDEPTH, không cần vượt quá độ dài chuỗi + 2 nước dự phòng, và không bao giờ vượt trần
    // TSS_MAX_FORCING_MOVES). Phần bitboard vẫn giữ nguyên — đó là tối ưu tốc độ THUẦN TUÝ, đã fuzz-test khớp
    // 100% với bản mảng gốc nên không đổi hành vi; phần lùi lại ở đây là NGÂN SÁCH ĐỘ SÂU, chỗ duy nhất có
    // đánh đổi thật giữa "lý thuyết chặt chẽ hơn" và "thực tế đáng tin hơn" — và thực tế phải thắng.
    const subDepth = Math.min(TSS_MAX_FORCING_MOVES, Math.max(TSS_DEFENSE_SUBDEPTH, opponentPath.length + 2));

    // Ưu tiên thử các ô nằm trong chính chuỗi đe doạ đó trước (khả năng cao nhất để chặn được),
    // sau đó mới tới các ứng viên gần quân cờ khác.
    const tried = new Set();
    const orderedCandidates = [];
    opponentPath.forEach(idx => { if(!b[idx] && !tried.has(idx)){ tried.add(idx); orderedCandidates.push(idx); } });
    getCandidatesBB(bb, size, 2).forEach(idx => { if(!tried.has(idx)){ tried.add(idx); orderedCandidates.push(idx); } });

    const limit = Math.min(orderedCandidates.length, TSS_DEFENSE_MAX_CANDIDATES);
    const safeCandidates = []; // các nước đã xác minh CHẮC CHẮN phá được chuỗi đe doạ

    for(let i = 0; i < limit; i++){
      if(Date.now() > searchDeadline) break;
      if(safeCandidates.length >= TSS_DEFENSE_KEEP_TOP) break; // đã đủ lựa chọn an toàn để so sánh, khỏi thử thêm

      const idx = orderedCandidates[i];
      const idxR = Math.floor(idx/size), idxC = idx%size;
      b[idx] = mover;
      bb.set(idxR, idxC, mover);
      try {
        // Nước phòng thủ này lỡ khiến chính mover thắng luôn thì quá tốt, chọn ngay không cần so sánh gì thêm
        if(checkWinBB(bb, idxR, idxC, mover, len)){ b[idx] = null; bb.clear(idxR, idxC, mover); return idx; }

        // Chia thời gian còn lại cho các ứng viên còn phải thử (có sàn/trần), tránh 1 mốc cố định
        // dễ timeout oan với chuỗi dài, mà cũng tránh 1 ứng viên "ngốn" hết ngân sách của cả nhóm.
        const candidatesLeft = limit - i;
        const remaining = searchDeadline - Date.now();
        const perCandidateBudget = Math.max(TSS_DEFENSE_MIN_SUBBUDGET_MS,
          Math.min(TSS_DEFENSE_MAX_SUBBUDGET_MS, remaining / Math.max(1, candidatesLeft)));
        const subDeadline = Math.min(searchDeadline, Date.now() + perCandidateBudget);

        let stillThreatened;
        try {
          const path2 = tssSearch(b, size, len, opponent, mover, subDepth, subDeadline, bb);
          stillThreatened = !!path2;
        } catch(e){
          if(e === 'VCF_TIMEOUT') stillThreatened = true; // không chắc chắn -> coi như chưa an toàn, thử ứng viên khác
          else throw e;
        }
        if(!stillThreatened) safeCandidates.push(idx); // nước này xác minh được là phá vỡ chuỗi đe doạ
      } finally {
        b[idx] = null;
        bb.clear(idxR, idxC, mover);
      }
    }

    if(safeCandidates.length === 0) return null; // không tìm được cách phá tuyệt đối trong ngân sách cho phép

    // 3) Có thể có nhiều nước cùng phá được chuỗi đe doạ -> chọn nước có giá trị tấn công/phòng thủ
    // tốt nhất (thay vì luôn lấy nước đầu tiên tìm được), vì việc chặn 1 chuỗi ép buộc thường không chỉ có 1 lựa chọn.
    let best = safeCandidates[0], bestScore = -Infinity;
    for(const idx of safeCandidates){
      const s = moveScore(b, size, len, idx, mover);
      if(s > bestScore){ bestScore = s; best = idx; }
    }
    return best;
  }

  // ===== Opening book: sách khai cuộc cho gomoku tự do (freestyle) =====
  // Ở 1-2 nước đầu ván, bàn cờ còn quá thưa quân nên evaluateBoard/moveScore chưa có đủ
  // thông tin để phân biệt tốt giữa các ô ứng viên (mọi hướng đều "trống như nhau"), trong khi
  // lý thuyết khai cuộc gomoku tự do đã có sẵn vài nguyên tắc kinh điển, đáng tin hơn nhiều so
  // với để engine tự dò từ một thế cờ gần như vô nghĩa:
  //   1) Nước đi đầu tiên của cả ván: luôn chiếm trung tâm — đây là điểm có nhiều đường thắng
  //      tiềm năng nhất (nằm trên nhiều hàng/cột/chéo đủ dài nhất so với bất kỳ ô nào khác).
  //   2) Nếu đối thủ đã chiếm trung tâm trước: đáp lại bằng một nước "kề chéo" sát trung tâm.
  //      Đây là lựa chọn thực dụng phổ biến trong gomoku tự do — vừa giữ liên lạc trực tiếp với
  //      trung tâm (không nhường không gian phát triển tốt nhất cho một mình đối thủ), vừa không
  //      lộ sớm ý đồ tấn công/phòng thủ theo một hướng cụ thể như khi ghé sát theo hàng/cột thẳng.
  //   3) Nếu đối thủ bỏ ngỏ trung tâm ở nước đầu: chiếm trung tâm ngay lập tức, vì trên bàn gần
  //      như trống, trung tâm luôn là điểm giá trị nhất bất kể đối thủ đã đi đâu.
  // Sách chỉ áp dụng cho 2 nước đầu; từ nước thứ 3 trở đi thế cờ đã đủ thông tin để nhường lại
  // hoàn toàn cho engine tìm kiếm (threat search + minimax/alpha-beta) tự tính như bình thường.
  function openingBookMove(b, size){
    const stoneCount = b.reduce((n, v) => n + (v ? 1 : 0), 0);
    if(stoneCount > 1) return null; // đã qua giai đoạn sách khai cuộc

    const mid = Math.floor(size / 2);
    const centerIdx = mid * size + mid;

    if(stoneCount === 0){
      return centerIdx; // nước 1 của cả ván: luôn vào trung tâm
    }

    // stoneCount === 1
    if(!b[centerIdx]){
      return centerIdx; // đối thủ bỏ ngỏ trung tâm ở nước đầu -> chiếm ngay
    }
    // Đối thủ đã chiếm trung tâm -> đáp trả bằng nước kề chéo cố định (mid+1, mid+1).
    // Luôn hợp lệ (không tràn biên) vì mid+1 < size với mọi cỡ bàn 15/30 đang hỗ trợ.
    const replyIdx = (mid + 1) * size + (mid + 1);
    if(!b[replyIdx]) return replyIdx;

    return null; // trường hợp hiếm (ô kề chéo vì lý do nào đó đã có quân) -> để engine tự tính
  }

  function bestMoveSmart(b, size, len, cfg){
    cfg = cfg || DIFFICULTY_CONFIG.hard; // không truyền cfg -> mặc định hành vi mạnh nhất (tương thích ngược)
    const moveStart = Date.now(); // mốc thời gian thực tế, dùng để cấp phát ngân sách chính xác cho bước 5 sau này
    const bookMove = openingBookMove(b, size);
    if(bookMove !== null) return bookMove;
    // Bitboard của thế cờ hiện tại — dựng 1 lần ở gốc, sau đó duy trì tăng-dần (set/clear) song song với
    // `b` xuyên suốt toàn bộ quá trình tìm nước đi (TSS, phòng thủ, alpha-beta), không dựng lại lần nào nữa.
    const bb = Bitboard.fromArray(b, size);
    const candidates = getCandidatesBB(bb, size, 2);
    if(candidates.length === 1) return candidates[0];

    // 1) Thắng ngay nếu có
    for(const idx of candidates){
      const ir = Math.floor(idx/size), ic = idx%size;
      b[idx] = 'O'; bb.set(ir, ic, 'O');
      const win = checkWinBB(bb, ir, ic, 'O', len);
      b[idx] = null; bb.clear(ir, ic, 'O');
      if(win) return idx;
    }

    // 2) Đối thủ có đang đe doạ thắng ngay không? Có thể có nhiều điểm đe doạ cùng lúc (song đe)
    const threats = [];
    for(const idx of candidates){
      const ir = Math.floor(idx/size), ic = idx%size;
      b[idx] = 'X'; bb.set(ir, ic, 'X');
      const lose = checkWinBB(bb, ir, ic, 'X', len);
      b[idx] = null; bb.clear(ir, ic, 'X');
      if(lose) threats.push(idx);
    }
    if(threats.length === 1) return threats[0];
    if(threats.length > 1){
      let best = -Infinity, pick = threats[0];
      for(const idx of threats){
        const s = moveScore(b, size, len, idx, 'O');
        if(s > best){ best = s; pick = idx; }
      }
      return pick;
    }

    // 3) Tìm chuỗi thắng ép buộc bằng TSS hợp nhất (bốn VÀ ba sống xét chung, không tách pha) - kỹ thuật
    // cao thủ, nhìn được rất sâu vì phần lớn nước ép buộc chỉ có 1 cách chặn nên nhánh tìm kiếm rất hẹp,
    // đồng thời vẫn bắt được các đòn tinh vi xen kẽ bốn/ba mà tách pha VCF-rồi-VCT trước đây bỏ sót.
    // Chỉ bật ở mức đủ khó (cfg.useTss) — đây là 1 "chiêu" khá hiểm, hiện chỉ tắt ở mức 'medium' ("Dễ")
    // cho máy chơi tự nhiên và dễ lường hơn, đúng tinh thần của mức độ đó.
    if(cfg.useTss){
      const tssMult = cfg.tssMult || 1;
      const tssDeadline = Date.now() + TSS_TIME_BUDGET_MS * tssMult;
      let tssPath = null;
      try {
        tssPath = tssSearch(b, size, len, 'O', 'X', TSS_MAX_FORCING_MOVES, tssDeadline, bb);
      } catch(e){
        if(e !== 'VCF_TIMEOUT') throw e;
      }
      if(tssPath && tssPath.length){
        return tssPath[0]; // đã tìm ra đường thắng chắc chắn, chỉ cần đi đúng nước đầu tiên
      }
    }

    // 4) Không tự thắng được -> kiểm tra ngược lại: đối thủ có đang âm thầm xây chuỗi ép buộc thắng
    // (bốn và/hoặc ba sống) hay không? Nếu có, tìm nước đi phá vỡ chuỗi đó trước khi quá muộn.
    // Deadline cấp cho cả pha phát hiện lẫn pha tìm nước phá (đã mở rộng) — findForcingDefense sẽ tự co lại
    // về ngân sách mặc định nhỏ hơn nếu hoá ra không có mối đe doạ thật nào (đỡ tốn thời gian oan).
    // Cờ cfg.useDeepDefense hiện TRUE ở cả 3 mức còn lại (Dễ/Vừa/Khó) — mức từng tắt cờ này (để máy
    // "không nhận ra" 1 bẫy đang giăng ra, y hệt người chơi mới thật sự) là mức 'easy' đã bị bỏ khỏi
    // danh sách độ khó; giữ nguyên cờ cfg.useDeepDefense trong cấu hình để dễ khôi phục/thêm mức nhẹ
    // hơn sau này nếu cần, không xoá hẳn logic if bên dưới dù hiện tại luôn đúng.
    if(cfg.useDeepDefense){
      const tssMult = cfg.tssMult || 1;
      const defenseDeadline = Date.now() + (TSS_DEFENSE_DETECT_BUDGET_MS + TSS_DEFENSE_SEARCH_BUDGET_ESCALATED_MS) * tssMult;
      let defenseMove = null;
      try {
        defenseMove = findForcingDefense(b, size, len, 'O', 'X', defenseDeadline, tssMult, bb);
      } catch(e){
        if(e !== 'VCF_TIMEOUT') throw e;
      }
      if(defenseMove !== null && defenseMove !== undefined && !b[defenseMove]){
        return defenseMove;
      }
    }

    // 5) Không có mối đe doạ VCF nào cần xử lý đặc biệt -> đào sâu dần bằng minimax + alpha-beta
    // với phần ngân sách thời gian còn lại. Dùng thời gian THỰC TẾ đã trôi qua (moveStart) thay vì
    // cộng dồn các hằng số cố định — vì nếu ở trên không có đe doạ VCF nào cần xử lý, các bước 3-4
    // thường kết thúc rất nhanh (không dùng hết ngân sách), nên bước 5 vẫn còn dư nhiều thời gian để đào sâu hơn.
    const elapsed = Date.now() - moveStart;
    const remainingBudget = Math.max(150, cfg.timeBudget - elapsed);
    const deadline = Date.now() + remainingBudget;
    const rootCandidates = topCandidates(b, size, len, candidates, 10, 'O');
    let bestMoveOverall = rootCandidates[0];
    let lastDepthResults = null; // [{idx, val}] của lần đào 1 depth HOÀN TẤT gần nhất (không bị cắt giữa chừng)
    let provenWin = false;

    // Bảng transposition: dùng chung cho toàn bộ vòng đào sâu dần TRONG lượt đi này (kết quả tính ở
    // độ sâu nông hơn được tái sử dụng khi đào tới độ sâu lớn hơn) — VÀ giờ còn được giữ lại bền vững
    // XUYÊN SUỐT các lượt đi khác nhau của cả ván (xem getPersistentTT ở trên), miễn là cùng cỡ bàn.
    const tt = getPersistentTT(size);
    const [rootH1, rootH2] = computeZobristHash(b);
    // Bảng killer-move + history dùng chung cho cả vòng đào sâu dần: nước nào gây cắt tỉa beta
    // trong 1 lần đào sẽ được ưu tiên thử trước ở các nhánh khác cùng độ sâu, kể cả ở lần đào sâu hơn kế tiếp.
    const heur = makeSearchHeuristics();

    // Bộ đánh giá tăng-dần: quét toàn bàn ĐÚNG 1 LẦN ở đây (tương đương evaluateBoard tại thế cờ hiện
    // tại), sau đó suốt cả quá trình đào sâu dần bên dưới chỉ cần cập nhật cục bộ quanh mỗi nước đi thử
    // nghiệm — thay vì quét lại toàn bàn ở MỌI nút lá như trước.
    const incEval = new IncrementalEvaluator(size, len);
    incEval.initFull(b);

    try {
      for(let depth = 2; depth <= cfg.maxPlies; depth += 2){
        let bestVal = -Infinity;
        let bestIdxThisDepth = rootCandidates[0];
        const depthResults = [];
        for(const idx of rootCandidates){
          const ir = Math.floor(idx/size), ic = idx%size;
          b[idx] = 'O';
          bb.set(ir, ic, 'O');
          incEval.applyMove(b, idx);
          const nh1 = rootH1 ^ ZOBRIST_O[idx][0], nh2 = rootH2 ^ ZOBRIST_O[idx][1];
          let val;
          try {
            val = alphaBeta(b, size, len, depth-1, -Infinity, Infinity, false, idx, 'O', deadline, nh1, nh2, tt, heur, incEval, bb);
          } finally {
            b[idx] = null; // luôn dọn lại, kể cả khi bị huỷ giữa chừng do hết giờ
            bb.clear(ir, ic, 'O');
            incEval.applyMove(b, idx);
          }
          depthResults.push({ idx, val });
          if(val > bestVal){ bestVal = val; bestIdxThisDepth = idx; }
        }
        bestMoveOverall = bestIdxThisDepth;
        lastDepthResults = depthResults; // đào xong trọn 1 lượt depth (không bị hết giờ giữa chừng) -> dùng được
        if(bestVal >= WIN_SCORE){ provenWin = true; break; } // đã chắc thắng theo tính toán, không cần đào sâu hơn
        if(Date.now() > deadline) break;

        // Đưa nước tốt nhất vừa tìm được lên đầu danh sách root cho lần đào sâu hơn kế tiếp — nhiều khả năng
        // nó vẫn là nước tốt nhất ở độ sâu lớn hơn, xét nó trước giúp cửa sổ alpha-beta thu hẹp nhanh hơn
        // ngay từ đầu, cắt tỉa các ứng viên còn lại hiệu quả hơn (nguyên lý "principal variation" kinh điển).
        const pos = rootCandidates.indexOf(bestIdxThisDepth);
        if(pos > 0){
          rootCandidates.splice(pos, 1);
          rootCandidates.unshift(bestIdxThisDepth);
        }
      }
    } catch(e){
      if(e !== 'AI_TIMEOUT') throw e;
    }

    // Ở mức 'medium' ("Dễ", cfg.randomTopN > 1 — hiện là mức DUY NHẤT còn lại có giá trị này > 1): thay
    // vì luôn chọn nước tốt nhất tuyệt đối, chọn NGẪU NHIÊN trong nhóm vài nước đứng đầu (theo lần đào
    // depth hoàn tất gần nhất) — mô phỏng 1 người chơi chưa đủ "tinh" để luôn thấy được lựa chọn tối ưu
    // nhất, mà KHÔNG đi 1 nước rõ ràng tệ (trông giả tạo).
    // Bỏ qua bước này nếu đã CHẮC CHẮN tìm ra đường thắng (provenWin) — thấy đường thắng thì luôn đi đúng,
    // kể cả ở mức "Dễ" (một AI "cố tình" bỏ lỡ nước thắng đã thấy rõ sẽ trông như bug, không phải "dễ").
    if(!provenWin && cfg.randomTopN > 1 && lastDepthResults && lastDepthResults.length > 1){
      const sorted = lastDepthResults.slice().sort((a, c) => c.val - a.val);
      const pool = sorted.slice(0, Math.min(cfg.randomTopN, sorted.length));
      return pool[Math.floor(Math.random() * pool.length)].idx;
    }

    return bestMoveOverall;
  }

  // Điểm vào duy nhất để quyết định 1 nước đi của máy — tự chọn đúng đường tính (3x3 hay bàn lớn) và
  // đúng bộ tham số theo độ khó hiện tại. Dùng chung cho cả luồng chính (fallback) lẫn bên trong Worker.
  function decideAiMove(b, size, len, difficultyLevel){
    if(size === 3) return bestMoveFor3x3(b, difficultyLevel);
    const cfg = DIFFICULTY_CONFIG[difficultyLevel] || DIFFICULTY_CONFIG.hard;
    return bestMoveSmart(b, size, len, cfg);
  }

  // ===== AI Worker: chạy tính toán AI trên luồng riêng để không đứng hình giao diện =====
  // Lý do cần: trên bàn 15x15/30x30, minimax + alpha-beta có thể "suy nghĩ" tới gần 2 giây (tổng các
  // ngân sách TSS + phòng thủ + đào sâu dần cộng lại). Nếu chạy thẳng trên luồng chính — nơi cũng lo
  // vẽ giao diện — cả trang sẽ đứng hình suốt thời gian đó: không cuộn được, không click được, animation
  // khựng lại. Đưa toàn bộ phần tính toán thuần tuý (chỉ nhận vào board/size/len, không đụng DOM hay bất
  // kỳ biến giao diện nào) sang 1 Worker chạy song song giải quyết triệt để việc đó.
  //
  // Cách dựng mã nguồn cho Worker: lấy lại NGUYÊN VĂN các hàm AI thuần bên trên bằng fn.toString(), ghép
  // thành 1 chuỗi mã nguồn độc lập rồi nạp vào Worker qua Blob URL — thay vì chép tay 1 bản riêng dễ bị
  // lệch mỗi khi sửa hàm gốc. Nhờ vậy chỉ có DUY NHẤT MỘT bản mã AI trong toàn bộ file; Worker luôn tự
  // dùng đúng bản mới nhất ở lần tải trang kế tiếp.
  //
  // Lưu ý quan trọng — vì sao "chuyển tính toán sang Worker" một cách ngây thơ có thể khiến CẢ APP
  // không chạy được nữa: nếu trang được mở trực tiếp bằng cách bấm đúp file (địa chỉ bắt đầu bằng
  // "file://" thay vì "http://"/"https://"), một số trình duyệt (đặc biệt Chrome) CẤM tạo Worker hoàn
  // toàn — kể cả khi dùng Blob URL — vì trang mở kiểu "file://" bị coi là origin không tin cậy. Nếu để
  // lỗi đó rơi ra ngoài mà không bắt, toàn bộ script phía sau (bao gồm cả phần khởi tạo giao diện) có
  // thể không chạy được nữa. Cách xử lý đúng: BỌC việc tạo Worker trong try/catch, và bất cứ khi nào
  // Worker không dùng được (tạo lỗi ngay từ đầu, hoặc báo lỗi giữa chừng lúc đang chạy) đều tự động
  // quay về tính toán đồng bộ trên luồng chính — đúng hành vi trước khi có Worker. Nhờ vậy app LUÔN
  // chạy được trong MỌI trường hợp (mở qua file:// hay qua server đều được); chỉ riêng phần "không đứng
  // hình UI" là mất đi ở những trường hợp hiếm Worker bị chặn.
  function buildAiWorkerBlobUrl(){
    // Các hằng số đọc trực tiếp từ giá trị hiện tại của luồng chính (không chép tay số) để không bao
    // giờ bị lệch nếu sau này có ai chỉnh lại 1 trong các hằng số này ở phần khai báo phía trên.
    const consts = `
      const AI_TIME_BUDGET_MS = ${AI_TIME_BUDGET_MS};
      const AI_MAX_PLIES = ${AI_MAX_PLIES};
      const WIN_SCORE = ${WIN_SCORE};
      const ZOBRIST_MAX_CELLS = ${ZOBRIST_MAX_CELLS};
      const TT_EXACT = ${TT_EXACT}, TT_LOWER = ${TT_LOWER}, TT_UPPER = ${TT_UPPER};
      const TT_MAX_ENTRIES = ${TT_MAX_ENTRIES};
      const TSS_TIME_BUDGET_MS = ${TSS_TIME_BUDGET_MS};
      const TSS_MAX_FORCING_MOVES = ${TSS_MAX_FORCING_MOVES};
      const TSS_BRANCH_NARROW = ${TSS_BRANCH_NARROW};
      const TSS_BRANCH_WIDE = ${TSS_BRANCH_WIDE};
      const TSS_DEFENSE_DETECT_BUDGET_MS = ${TSS_DEFENSE_DETECT_BUDGET_MS};
      const TSS_DEFENSE_SEARCH_BUDGET_ESCALATED_MS = ${TSS_DEFENSE_SEARCH_BUDGET_ESCALATED_MS};
      const TSS_DEFENSE_SUBDEPTH = ${TSS_DEFENSE_SUBDEPTH};
      const TSS_DEFENSE_MAX_CANDIDATES = ${TSS_DEFENSE_MAX_CANDIDATES};
      const TSS_DEFENSE_MIN_SUBBUDGET_MS = ${TSS_DEFENSE_MIN_SUBBUDGET_MS};
      const TSS_DEFENSE_MAX_SUBBUDGET_MS = ${TSS_DEFENSE_MAX_SUBBUDGET_MS};
      const TSS_DEFENSE_KEEP_TOP = ${TSS_DEFENSE_KEEP_TOP};
      const KILLER_SLOTS = ${KILLER_SLOTS};
      const HISTORY_WEIGHT = ${HISTORY_WEIGHT};
      const DIFFICULTY_CONFIG = ${JSON.stringify(DIFFICULTY_CONFIG)};
      // 4 hướng dùng chung bởi computeCellDirContribution/IncrementalEvaluator — dữ liệu thuần (không
      // phải hàm) nên phải khai báo riêng ở đây, không tự "đi kèm" khi chép nguyên văn source hàm.
      const EVAL_DIRS = [[0,1],[1,0],[1,1],[1,-1]];
      // Bảng TT của riêng Worker này — sống suốt vòng đời Worker (tức suốt cả phiên chơi, vì Worker
      // không bị huỷ giữa các lượt), đảm nhiệm luôn phần "TT bền vững xuyên suốt ván" trong môi trường
      // có Worker, độc lập hoàn toàn với bảng TT dự phòng ở luồng chính (chỉ dùng khi không có Worker).
      let persistentTT = new Map();
      let persistentTTBoardSize = null;
    `;

    // Ghép nguyên văn source code của toàn bộ các hàm AI thuần (không đụng DOM) cần cho việc tính nước đi.
    const fnsSource = [
      checkWinAt, randInt32, computeZobristHash,
      minimax, bestMoveMinimax,
      pickRandomEmpty, findImmediateWinOrBlock, bestMoveFor3x3,
      getPersistentTT,
      Bitboard, runLenAt, checkWinBB, getCandidatesBB,
      lineScore, windowPatternCompletion, evaluatePoint, computeForkBonus, evaluateBoard,
      computeCellDirContribution, IncrementalEvaluator,
      getCandidates, moveScore, topCandidates,
      makeSearchHeuristics, orderCandidatesForSearch, recordCutoff,
      alphaBeta,
      analyzeForcingMove, findForcingMoves, tssSearch, findForcingDefense,
      openingBookMove, bestMoveSmart, decideAiMove
    ].map(fn => fn.toString()).join('\n\n');

    // Worker tự dựng bảng Zobrist riêng của nó (không cần khớp với bảng bên luồng chính — TT của mỗi
    // bên hoàn toàn độc lập, chỉ cần nhất quán NỘI BỘ trong chính worker đó là đủ).
    const zobristInit = `
      const ZOBRIST_O = new Array(ZOBRIST_MAX_CELLS);
      const ZOBRIST_X = new Array(ZOBRIST_MAX_CELLS);
      for(let i=0;i<ZOBRIST_MAX_CELLS;i++){
        ZOBRIST_O[i] = [randInt32(), randInt32()];
        ZOBRIST_X[i] = [randInt32(), randInt32()];
      }
    `;

    const onmessage = `
      self.onmessage = function(e){
        const { board, boardSize, winLen, difficulty, requestId } = e.data;
        let idx = null;
        try {
          idx = decideAiMove(board, boardSize, winLen, difficulty);
        } catch(err){
          idx = null; // lỗi bất ngờ trong lúc tính -> trả về null, phía gọi sẽ tự bỏ qua an toàn
        }
        self.postMessage({ idx, requestId });
      };
    `;

    const source = consts + '\n' + fnsSource + '\n' + zobristInit + '\n' + onmessage;
    return URL.createObjectURL(new Blob([source], { type: 'application/javascript' }));
  }

  // Lấy Worker hiện có, hoặc tạo mới nếu chưa có (và trước đó chưa từng thất bại). Trả về `null` nếu
  // Worker không dùng được vì bất kỳ lý do gì — nơi gọi hàm này PHẢI tự quay về tính đồng bộ khi nhận null.
  function getAiWorker(){
    if(aiWorkerFailed) return null;
    if(aiWorker) return aiWorker;
    try {
      const url = buildAiWorkerBlobUrl();
      const w = new Worker(url);
      w.onerror = function(){
        // Worker báo lỗi giữa chừng (vd bị trình duyệt chặn ngay cả sau khi tạo thành công) -> đánh dấu
        // hỏng vĩnh viễn cho phiên này, huỷ worker, và nếu đang có 1 yêu cầu dang dở chờ nó phản hồi thì
        // tự phục hồi bằng tính đồng bộ ngay — tránh treo UI ở trạng thái "Đang nghĩ…" mãi mãi.
        aiWorkerFailed = true;
        aiWorker = null;
        try { w.terminate(); } catch(err){}
        recoverFromWorkerFailure();
      };
      aiWorker = w;
      return w;
    } catch(e){
      // Tạo Worker thất bại ngay lập tức (vd môi trường không hỗ trợ, hoặc bị chặn do mở qua file://)
      aiWorkerFailed = true;
      aiWorker = null;
      return null;
    }
  }

  // Được gọi khi Worker chết giữa lúc đang có 1 yêu cầu chưa được trả lời (xem w.onerror ở trên).
  function recoverFromWorkerFailure(){
    if(!aiPendingRecovery) return;
    const { boardSnapshot, size, len, diff, token } = aiPendingRecovery;
    aiPendingRecovery = null;
    if(token !== aiRequestSeq) return; // yêu cầu này đã bị huỷ trong lúc chờ (undo/đổi ván...), không cần phục hồi nữa
    const idx = decideAiMove(boardSnapshot, size, len, diff);
    finishAiMove(idx, token);
  }

  function newRound(){
    clearPendingAiMove();
    board = Array(boardSize*boardSize).fill(null);
    setRoundStarter(startingPlayer);
    gameOver = false;
    lastMoveIdx = null;
    history = [];
    pieRuleArmed = swapRuleEnabled && boardSize !== 3 && mode === 'pvp';
    buildBoard();
    render();
    ensureAiTurnScheduled();
    saveState();
  }

  function switchMode(newMode){
    mode = newMode;
    [...modeTabs.querySelectorAll('button')].forEach(btn=> btn.classList.toggle('active', btn.dataset.mode === newMode));
    updateIndicator(modeTabs);
    updateDifficultyToggle();
    updateSwapRuleToggle();
    newRound();
  }

  function remapBoardToCenter(oldBoard, oldSize, newSize){
    const newBoard = Array(newSize*newSize).fill(null);
    const offset = Math.floor((newSize - oldSize) / 2);
    for(let r=0;r<oldSize;r++){
      for(let c=0;c<oldSize;c++){
        const val = oldBoard[r*oldSize+c];
        if(!val) continue;
        const nr = r + offset, nc = c + offset;
        if(nr>=0 && nr<newSize && nc>=0 && nc<newSize){
          newBoard[nr*newSize+nc] = val;
        }
      }
    }
    return newBoard;
  }

  function applySizeChange(newSize, fresh){
    clearPendingAiMove();
    const offset = Math.floor((newSize - boardSize) / 2);

    if(fresh){
      board = Array(newSize*newSize).fill(null);
      lastMoveIdx = null;
      // Đổi cỡ bàn KHÔNG phải là 1 trận đấu đã kết thúc -> KHÔNG được luân phiên người đi trước ở đây.
      // Chỉ đơn giản áp dụng lại đúng người đang được xếp đi trước hiện tại (startingPlayer giữ nguyên),
      // khác với newRound() (dùng setRoundStarter) — nơi việc luân phiên thực sự nên xảy ra, vì đó mới
      // là lúc bắt đầu 1 trận đấu MỚI sau khi trận trước đã xong.
      current = startingPlayer;
    } else {
      board = remapBoardToCenter(board, boardSize, newSize);
      if(lastMoveIdx !== null){
        const r = Math.floor(lastMoveIdx / boardSize) + offset;
        const c = (lastMoveIdx % boardSize) + offset;
        lastMoveIdx = (r>=0 && r<newSize && c>=0 && c<newSize) ? r*newSize+c : null;
      }
    }

    history = [];
    boardSize = newSize;
    winLen = SIZE_CONFIG[newSize].winLen;
    gameOver = false;
    // Đổi cỡ bàn -> chỉ số ô (index) mang ý nghĩa hoàn toàn khác trên bàn mới, giải phóng TT cũ ngay
    // để tránh giữ trong bộ nhớ những entry chắc chắn không còn dùng lại được (xem lưu ý an toàn ở
    // getPersistentTT). Lượt AI kế tiếp sẽ tự cấp phát bảng mới đúng cỡ bàn.
    persistentTT = new Map();
    persistentTTBoardSize = newSize;

    updateSizeToggle();
    updateSwapRuleToggle();

    buildBoard();
    render();
    ensureAiTurnScheduled();
    saveState();
  }

  function switchSize(newSize){
    if(newSize === boardSize) return;
    const inProgress = !gameOver && board.some(v=>v);

    if(!inProgress){
      applySizeChange(newSize, true);
      return;
    }

    // Kiểm tra thế cờ hiện tại có vừa với bàn kích thước mới không (căn giữa)
    const remapped = remapBoardToCenter(board, boardSize, newSize);
    const oldCount = board.filter(v=>v).length;
    const newCount = remapped.filter(v=>v).length;

    if(newCount < oldCount){
      const lost = oldCount - newCount;
      SFX.warn();
      openModal({
        icon: '⚠️',
        title: 'Thế cờ không phù hợp',
        sub: `Bàn ${newSize} x ${newSize} không đủ chỗ cho thế cờ hiện tại (sẽ mất ${lost} quân nếu chuyển). Bạn có muốn bắt đầu ván mới ở kích thước này không?`,
        buttons: [
          { label: `Ván mới ${newSize}x${newSize}`, cls: 'primary', onClick: ()=> applySizeChange(newSize, true) },
          { label: 'Giữ bàn hiện tại', cls: 'secondary' }
        ]
      });
      return;
    }

    applySizeChange(newSize, false);
  }

  function applySnapshot(snap){
    board = snap.board.slice();
    current = snap.current;
    lastMoveIdx = snap.lastMoveIdx;
    gameOver = false;
    [...boardEl.children].forEach(c=> c.classList.remove('win-cell'));
    render();
    setTurnDisplay('Đang đi');
    saveState();
  }

  function undoMove(){
    clearPendingAiMove();
    if(history.length === 0){
      openModal({
        icon: '🤷',
        title: 'Chưa có nước đi nào',
        sub: 'Bàn cờ hiện đang trống, không có gì để quay lại cả.',
        buttons: [ { label: 'Đã hiểu', cls: 'primary' } ]
      });
      return;
    }
    let snap = history.pop();
    // Đấu với máy: lùi luôn cả nước đi của máy để về đúng lượt người chơi
    while(mode === 'ai' && snap.current === 'O' && history.length > 0){
      snap = history.pop();
    }
    // Lùi hết về đúng bàn trống (ván coi như chưa bắt đầu lại) -> tái vũ trang Luật đổi quân đầu nếu
    // đang bật, để không bị "mất" luật chỉ vì người chơi undo về rồi đi lại nước đầu khác.
    if(history.length === 0 && snap.board.every(v=>!v)){
      pieRuleArmed = swapRuleEnabled && boardSize !== 3 && mode === 'pvp';
    }
    SFX.undo();
    applySnapshot(snap);
  }

  undoBtn.addEventListener('click', ()=>{
    SFX.click();
    if(history.length === 0){ undoMove(); return; }
    openModal({
      icon: '↩️',
      title: 'Quay lại nước đi trước?',
      sub: mode === 'ai'
        ? 'Nước đi gần nhất của bạn (và của máy, nếu có) sẽ được xoá bỏ.'
        : 'Nước đi gần nhất trên bàn cờ sẽ được xoá bỏ.',
      buttons: [
        { label: 'Quay lại', cls: 'primary', onClick: undoMove },
        { label: 'Huỷ', cls: 'secondary' }
      ]
    });
  });

  function confirmIfInProgress(action){
    const inProgress = !gameOver && board.some(v=>v);
    if(inProgress){
      openModal({
        icon: '✏️',
        title: 'Bắt đầu ván mới?',
        sub: 'Ván đang chơi dở sẽ không được tính.',
        buttons: [
          { label: 'Đồng ý', cls: 'primary', onClick: action },
          { label: 'Huỷ', cls: 'secondary' }
        ]
      });
    } else {
      action();
    }
  }

  // Khôi phục ván cờ đã lưu (nếu có) khi mở lại trang. Có kiểm tra dữ liệu kỹ để tránh
  // trang bị lỗi trắng nếu dữ liệu lưu bị hỏng/cũ (ví dụ đổi định dạng ở phiên bản sau).
  // Trả về true nếu khôi phục thành công, false nếu không có gì để khôi phục (hoặc dữ liệu hỏng).
  function restoreState(){
    const saved = loadState();
    if(!saved) return false;
    try {
      if(!SIZE_CONFIG[saved.boardSize]) return false;
      if(saved.mode !== 'pvp' && saved.mode !== 'ai') return false;
      const expectedLen = saved.boardSize * saved.boardSize;
      if(!Array.isArray(saved.board) || saved.board.length !== expectedLen) return false;

      mode = saved.mode;
      boardSize = saved.boardSize;
      winLen = SIZE_CONFIG[boardSize].winLen;
      board = saved.board.map(v => (v === 'X' || v === 'O') ? v : null);
      current = saved.current === 'O' ? 'O' : 'X';
      gameOver = !!saved.gameOver;
      lastMoveIdx = Number.isInteger(saved.lastMoveIdx) && saved.lastMoveIdx >= 0 && saved.lastMoveIdx < expectedLen
        ? saved.lastMoveIdx : null;
      scores = {
        X: Number.isFinite(saved.scores?.X) ? saved.scores.X : 0,
        O: Number.isFinite(saved.scores?.O) ? saved.scores.O : 0,
        D: Number.isFinite(saved.scores?.D) ? saved.scores.D : 0
      };
      theme = saved.theme === 'dark' ? 'dark' : 'light';
      muted = !!saved.muted;
      startingPlayer = saved.startingPlayer === 'O' ? 'O' : 'X';
      difficulty = DIFFICULTY_ORDER.includes(saved.difficulty) ? saved.difficulty : 'hard';
      swapRuleEnabled = !!saved.swapRuleEnabled;
      history = Array.isArray(saved.history)
        ? saved.history.filter(h => h && Array.isArray(h.board) && h.board.length === expectedLen)
        : [];

      // Đồng bộ lại toàn bộ giao diện cho khớp trạng thái vừa khôi phục
      [...modeTabs.querySelectorAll('button')].forEach(btn => btn.classList.toggle('active', btn.dataset.mode === mode));
      applyTheme();
      applySound();
      buildBoard();
      render();
      updateIndicator(modeTabs);
      updateSizeToggle();
      updateDifficultyToggle();
      updateSwapRuleToggle();

      if(gameOver){
        // Vẽ lại đường thắng (nếu có) để thế cờ khôi phục trông đúng như lúc kết thúc ván
        if(lastMoveIdx !== null && board[lastMoveIdx]){
          const winCells = checkWinAt(board, boardSize, winLen, lastMoveIdx, board[lastMoveIdx]);
          if(winCells) winCells.forEach(i => boardEl.children[i]?.classList.add('win-cell'));
        }
        setTurnDisplay('Đã kết thúc');
      } else {
        // Nếu lúc lưu đang là lượt máy tính nước (ví dụ người chơi refresh đúng lúc máy đang nghĩ,
        // hoặc ván vừa khôi phục bắt đầu bằng O), cho máy tính tiếp nước đi đó thay vì kẹt màn hình chờ mãi
        ensureAiTurnScheduled();
      }
      return true;
    } catch(e){
      return false;
    }
  }

  newRoundBtn.addEventListener('click', ()=>{ SFX.click(); confirmIfInProgress(newRound); });

  resetScoreBtn.addEventListener('click', ()=>{
    SFX.click();
    openModal({
      icon: '🗑️',
      title: 'Xoá hết điểm?',
      sub: 'Điểm của X, O và Hòa sẽ về lại 0.',
      buttons: [
        { label: 'Xoá điểm', cls: 'danger', onClick: ()=>{ scores = { X:0, O:0, D:0 }; render(); saveState(); } },
        { label: 'Huỷ', cls: 'secondary' }
      ]
    });
  });

  modeTabs.addEventListener('click', (e)=>{
    const btn = e.target.closest('button');
    if(!btn) return;
    SFX.click();
    const newMode = btn.dataset.mode;
    if(newMode === mode) return;
    confirmIfInProgress(()=> switchMode(newMode));
  });

  sizeToggleBtn.addEventListener('click', ()=>{
    SFX.click();
    const idx = SIZE_ORDER.indexOf(boardSize);
    const next = SIZE_ORDER[(idx + 1) % SIZE_ORDER.length];
    switchSize(next);
  });

  // Đổi độ khó KHÔNG cần hỏi xác nhận như đổi mode/cỡ bàn — không làm mất thế cờ đang chơi, chỉ đổi
  // "não bộ" của máy áp dụng từ nước tiếp theo trở đi, nên áp dụng ngay lập tức cho mượt trải nghiệm.
  function setDifficulty(newDifficulty){
    if(newDifficulty === difficulty) return;
    difficulty = newDifficulty;
    updateDifficultyToggle();
    saveState();
    // Nếu máy đang tính nước theo độ khó CŨ ngay lúc này, huỷ và lên lịch tính lại ngay theo độ khó
    // MỚI cho đúng lượt hiện tại, thay vì để nó lỡ đi 1 nước theo độ khó vừa đổi bỏ.
    if(mode === 'ai' && current === 'O' && !gameOver){
      clearPendingAiMove();
      ensureAiTurnScheduled();
    }
  }
  difficultyToggleBtn.addEventListener('click', ()=>{
    SFX.click();
    const idx = DIFFICULTY_ORDER.indexOf(difficulty);
    const next = DIFFICULTY_ORDER[(idx + 1) % DIFFICULTY_ORDER.length];
    setDifficulty(next);
  });

  // Luật đổi quân đầu: chỉ cho bật/tắt khi ván hiện tại CHƯA có nước đi nào (đổi giữa chừng vô nghĩa,
  // vì mốc áp dụng luôn là "ngay sau nước đi đầu tiên của ván"). Có hiệu lực từ ván tiếp theo.
  swapRuleToggleBtn.addEventListener('click', ()=>{
    if(!gameOver && board.some(v=>v)){
      SFX.warn();
      openModal({
        icon: 'ℹ️',
        title: 'Áp dụng từ ván sau',
        sub: 'Ván đang chơi đã có nước đi nên không đổi luật giữa chừng được. Đổi luật ngay bây giờ sẽ áp dụng từ ván mới tiếp theo.',
        buttons: [
          { label: 'Đổi luật (áp dụng ván sau)', cls: 'primary', onClick: ()=>{
              swapRuleEnabled = !swapRuleEnabled;
              updateSwapRuleToggle();
              saveState();
            }
          },
          { label: 'Thôi', cls: 'secondary' }
        ]
      });
      return;
    }
    SFX.click();
    swapRuleEnabled = !swapRuleEnabled;
    updateSwapRuleToggle();
    pieRuleArmed = swapRuleEnabled && boardSize !== 3 && mode === 'pvp';
    saveState();
  });

  if(!restoreState()){
    buildBoard();
    newRound();
    updateIndicator(modeTabs);
    updateSizeToggle();
    updateDifficultyToggle();
    updateSwapRuleToggle();
  }
})();
</script>
